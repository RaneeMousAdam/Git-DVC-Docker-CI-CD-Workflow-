name: Safe-Health High-Integrity Promotion Pipeline

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: safe-health-risk-model
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  integrity_audit:
    name: "Job 1 - Integrity Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install DVC
        run: |
          pip install --upgrade pip
          pip install dvc==3.51.2

      - name: Seed mock DVC remote storage
        run: |
          mkdir -p /tmp/dvc-remote
          HASH=$(md5sum data/patients.csv | awk '{print $1}')
          PREFIX="${HASH:0:2}"
          SUFFIX="${HASH:2}"
          mkdir -p "/tmp/dvc-remote/$PREFIX"
          cp data/patients.csv "/tmp/dvc-remote/$PREFIX/$SUFFIX"

      - name: Configure DVC remote
        run: |
          dvc remote add --force local_remote /tmp/dvc-remote
          dvc remote default local_remote

      - name: Pull dataset via DVC
        run: |
          dvc pull data/patients.csv.dvc --force

      - name: Verify DVC file integrity
        run: |
          STATUS=$(dvc status data/patients.csv.dvc 2>&1)
          if echo "$STATUS" | grep -q "modified\|deleted\|not in cache"; then
            echo "DVC drift detected: $STATUS"
            exit 1
          fi

      - name: Run data schema and quality check
        env:
          DATA_PATH: data/patients.csv
        run: |
          python scripts/check_data.py

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-audit-failure-log
          path: |
            data/
            scripts/check_data.py
          retention-days: 7

  forensic_build:
    name: "Job 2 - Forensic Build"
    runs-on: ubuntu-latest
    needs: integrity_audit

    if: |
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[build-image]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        id: docker_build
        run: |
          set -o pipefail
          docker buildx build \
            --file Dockerfile \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            --platform linux/amd64 \
            --load \
            --progress=plain \
            . 2>&1 | tee /tmp/docker-build.log

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: Save Docker image
        run: |
          docker save "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            | gzip > /tmp/safe-health-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/safe-health-image.tar.gz
          retention-days: 5

      - name: Upload build crash logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-crash-logs
          path: /tmp/docker-build.log
          retention-days: 14

  production_promotion:
    name: "Job 3 - Production Promotion"
    runs-on: ubuntu-latest
    needs: forensic_build

    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production
      url: https://clinic.safe-health.internal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/safe-health-image.tar.gz

      - name: Promote image to Production Registry
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Source image : ${IMAGE}:latest"
          echo "Target tag   : ${VERSION}"
          echo "Registry     : clinic-registry.safe-health.internal"
          echo "Promoting ${VERSION} to Clinic..."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Safe-Health Release ${{ steps.version.outputs.tag }}"
          body: |
            Safe-Health Patient Risk Model - ${{ steps.version.outputs.tag }}

            Promotion Summary:
            - Data Integrity Audit: PASSED
            - Forensic Docker Build: PASSED
            - Clinical Registry Promotion: COMPLETE

            Registry: clinic-registry.safe-health.internal
            Tag: ${{ steps.version.outputs.tag }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write audit log
        run: |
          echo "AUDIT LOG: $(date -u '+%Y-%m-%dT%H:%M:%SZ') | version=${{ steps.version.outputs.tag }} | actor=${{ github.actor }} | sha=${{ github.sha }} | status=PROMOTED_TO_PRODUCTION" >> promotion-audit.log
          cat promotion-audit.log
