name: Safe-Health High-Integrity Promotion Pipeline

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: safe-health-risk-model
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  integrity_audit:
    name: "Job 1 - Integrity Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dvc pandas

      - name: Verify dataset exists
        run: |
          if [ ! -f data/patients.csv ]; then
            echo "ERROR: data/patients.csv not found"
            exit 1
          fi
          echo "Dataset found with $(wc -l < data/patients.csv) lines"

      - name: Run data schema and quality check
        env:
          DATA_PATH: data/patients.csv
        run: python scripts/check_data.py

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-audit-failure-log
          path: |
            data/
            scripts/check_data.py
          retention-days: 7

  forensic_build:
    name: "Job 2 - Forensic Build"
    runs-on: ubuntu-latest
    needs: integrity_audit
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build-image]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: docker_build
        run: |
          set -o pipefail
          docker buildx build \
            --file Dockerfile \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            --platform linux/amd64 \
            --load \
            --progress=plain \
            . 2>&1 | tee /tmp/docker-build.log

      - name: Save Docker image
        run: |
          docker save "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            | gzip > /tmp/safe-health-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/safe-health-image.tar.gz
          retention-days: 5

      - name: Upload build crash logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-crash-logs
          path: /tmp/docker-build.log
          retention-days: 14

  production_promotion:
    name: "Job 3 - Production Promotion"
    runs-on: ubuntu-latest
    needs: forensic_build
    if: startsWith(github.ref, 'refs/tags/v') && (needs.forensic_build.result == 'success' || needs.forensic_build.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Promote image to Production Registry
        run: |
          echo "Promoting ${{ github.ref_name }} to Clinic..."
          echo "Status: PROMOTED TO PRODUCTION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Safe-Health Release ${{ github.ref_name }}"
          body: "Data Integrity: PASSED | Build: PASSED | Promotion: COMPLETE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
